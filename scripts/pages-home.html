<script>
(function () {
  try {
    var incoming = new URLSearchParams(location.search);
    var incomingTheme = incoming.get('theme');
    var incomingLang = incoming.get('lang');
    var hasIncomingTheme = incomingTheme === 'light' || incomingTheme === 'dark';
    var hasIncomingLang = incomingLang === 'zh-Hans' || incomingLang === 'zh-Hant' || incomingLang === 'en';
    if (hasIncomingTheme) localStorage.setItem('mi-theme', incomingTheme);
    if (hasIncomingLang) localStorage.setItem('mi-lang', incomingLang);
    if (hasIncomingTheme || hasIncomingLang) {
      try {
        var clean = new URL(location.href);
        clean.searchParams.delete('theme');
        clean.searchParams.delete('lang');
        history.replaceState(null, '', clean);
      } catch (e) {}
    }
    var theme = localStorage.getItem('mi-theme');
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    var favicon = document.getElementById('favicon');
    if (favicon) favicon.href = theme === 'dark' ? 'favicon.svg?v=19' : 'favicon-light.svg?v=4';
    var lang = localStorage.getItem('mi-lang');
    if (lang !== 'zh-Hans' && lang !== 'zh-Hant' && lang !== 'en') {
      lang = 'zh-Hans';
      var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'zh-CN'];
      for (var i = 0; i < list.length; i += 1) {
        var code = String(list[i] || '').toLowerCase();
        if (code.indexOf('zh') === 0) lang = /hant|tw|hk|mo/.test(code) ? 'zh-Hant' : 'zh-Hans';
        else lang = 'en';
        break;
      }
    }
    document.documentElement.lang = lang === 'zh-Hant' ? 'zh-Hant' : lang === 'en' ? 'en' : 'zh-CN';
  } catch (error) {}
})();
</script>

<script>
(function () {
  var WORKER = __WORKER__;
  WORKER = String(WORKER || '').replace(/\/+$/, '');
  var TOTAL = __TOTAL__;
  var LANG_KEY = 'mi-lang';
  var THEME_KEY = 'mi-theme';
  var LANGS = ['zh-Hans', 'zh-Hant', 'en'];
  var STR = {
    'zh-Hans': {
      pageTitle: 'mi2obtainium', storeName: '小米应用商店',
      meta: '粘贴小米应用商店链接、包名或应用名称，生成 Obtainium 可直接读取的更新源。',

      loadingIndex: '正在加载 {count} 个应用的搜索索引…', indexFailed: '搜索索引加载失败',

    },
    'zh-Hant': {
      pageTitle: 'mi2obtainium', storeName: '小米應用商店',
      meta: '貼上小米應用商店連結、套件名稱或應用程式名稱，產生 Obtainium 可直接讀取的更新來源。',
      placeholder: '貼上 app.mi.com 連結、套件名稱，或輸入應用程式名稱', searchAria: '搜尋小米應用商店', search: '搜尋',
      languageGroup: '語言', themeToDark: '切換深色模式', themeToLight: '切換淺色模式',
      loadingIndex: '正在載入 {count} 個應用程式的搜尋索引…', indexFailed: '搜尋索引載入失敗',
      empty: '找不到符合的應用程式', retry: '換個名稱或套件名稱試試', direct: '直接解析',
      found: '找到 {count} 個結果', foundLimit: '找到 {count} 個結果，顯示前 20 個',
      noWorker: ' · 尚未設定 WORKER_URL', noWorkerHint: '尚未設定 WORKER_URL · 先在 Pages 變數中設定 Worker 位址'
    },
    en: {
      pageTitle: 'mi2obtainium', storeName: 'Xiaomi App Store',
      meta: 'Paste a Xiaomi App Store link, package name, or app name to generate an update source Obtainium can read.',
      placeholder: 'Paste an app.mi.com link, package name, or app name', searchAria: 'Search Xiaomi App Store', search: 'Search',
      languageGroup: 'Language', themeToDark: 'Switch to dark mode', themeToLight: 'Switch to light mode',
      loadingIndex: 'Loading the search index for {count} apps…', indexFailed: 'Failed to load the search index',
      empty: 'No matching app found', retry: 'Try another name or package name', direct: 'Direct resolve',
      found: '{count} results found', foundLimit: '{count} results found, showing the first 20',
      noWorker: ' · WORKER_URL is not configured', noWorkerHint: 'WORKER_URL is not configured · set the Worker URL in Pages variables first'
    }
  };
  var lang = document.documentElement.lang === 'zh-Hant' ? 'zh-Hant' : document.documentElement.lang === 'en' ? 'en' : 'zh-Hans';
  var input = document.getElementById('q');
  var form = document.getElementById('searchForm');
  var results = document.getElementById('results');
  var status = document.getElementById('status');
  var apps = null;
  var loading = null;
  var timer = null;

  function t(key, vars) {
    var table = STR[lang] || STR['zh-Hans'];
    var text = table[key] || STR['zh-Hans'][key] || key;
    return String(text).replace(/\{(\w+)\}/g, function (_, name) { return String((vars || {})[name] || ''); });
  }

  var themeTimer = null;
  var lastThemeToggleAt = 0;

  function applyTheme(next, persist, immediate) {
    var theme = next === 'dark' ? 'dark' : 'light';
    var root = document.documentElement;
    if (immediate) {
      root.classList.add('theme-switching');
      clearTimeout(themeTimer);
      themeTimer = setTimeout(function () { root.classList.remove('theme-switching'); }, 260);
    }
    root.dataset.theme = theme;
    if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} }
    var meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f0f10' : '#ffffff');
    var favicon = document.getElementById('favicon');
    if (favicon) favicon.href = theme === 'dark' ? 'favicon.svg?v=19' : 'favicon-light.svg?v=4';
    var button = document.getElementById('themeToggle');
    if (button) {
      var label = theme === 'dark' ? t('themeToLight') : t('themeToDark');
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
    }
    document.querySelectorAll('[data-worker-pkg]').forEach(function (link) {
      link.href = workerHref(link.getAttribute('data-worker-pkg'));
    });
  }

  function applyLanguage(next, persist) {
    lang = LANGS.indexOf(next) >= 0 ? next : 'zh-Hans';
    if (persist) { try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} }
    document.documentElement.lang = lang === 'zh-Hant' ? 'zh-Hant' : lang === 'en' ? 'en' : 'zh-CN';
    document.title = t('pageTitle');
    var meta = document.getElementById('metaDescription');
    if (meta) meta.setAttribute('content', t('meta'));
    var store = document.getElementById('storeTitle');
    if (store) store.textContent = t('storeName');
    input.placeholder = t('placeholder');
    fitSearchText();
    input.setAttribute('aria-label', t('searchAria'));
    var submit = form.querySelector('button[type="submit"]');
    if (submit) submit.setAttribute('aria-label', t('search'));
    var group = document.querySelector('.lang-switch');
    if (group) group.setAttribute('aria-label', t('languageGroup'));
    document.querySelectorAll('[data-lang]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.getAttribute('data-lang') === lang));
    });
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false);
    if (input.value.trim() && results.classList.contains('show')) run();
  }

  var measureCtx = null;

  function fitSearchText() {
    if (!input) return;
    if (window.innerWidth > 440) {
      input.style.fontSize = '';
      return;
    }
    if (!measureCtx) {
      measureCtx = document.createElement('canvas').getContext('2d');
    }
    var available = input.clientWidth - 4;
    if (available <= 0) return;
    var family = getComputedStyle(input).fontFamily;
    var size = 12;
    measureCtx.font = '400 ' + size + 'px ' + family;
    while (size > 8.5 && measureCtx.measureText(input.placeholder || '').width > available) {
      size -= 0.5;
      measureCtx.font = '400 ' + size + 'px ' + family;
    }
    input.style.fontSize = size + 'px';
  }

  window.addEventListener('resize', fitSearchText);
  window.addEventListener('load', fitSearchText);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSearchText);
  input.addEventListener('focus', function () { input.style.fontSize = ''; });
  input.addEventListener('blur', fitSearchText);

  function workerHref(pkg) {
    var href = WORKER ? WORKER + '/o/' + encodeURIComponent(pkg) : '#';
    if (!WORKER) return href;
    var params = [];
    var manualTheme = '';
    var manualLang = '';
    try {
      manualTheme = localStorage.getItem(THEME_KEY) || '';
      manualLang = localStorage.getItem(LANG_KEY) || '';
    } catch (e) {}
    if (manualTheme === 'light' || manualTheme === 'dark') {
      params.push('theme=' + encodeURIComponent(manualTheme));
    }
    if (manualLang === 'zh-Hans' || manualLang === 'zh-Hant' || manualLang === 'en') {
      params.push('lang=' + encodeURIComponent(manualLang));
    }
    if (params.length) href += '?' + params.join('&');
    return href;
  }

  function rememberCurrentState() {
    var manualTheme = '';
    var manualLang = '';
    try {
      manualTheme = localStorage.getItem(THEME_KEY) || '';
      manualLang = localStorage.getItem(LANG_KEY) || '';
    } catch (e) {}
    var next = new URL(location.href);
    if (manualTheme === 'light' || manualTheme === 'dark') next.searchParams.set('theme', manualTheme);
    else next.searchParams.delete('theme');
    if (manualLang === 'zh-Hans' || manualLang === 'zh-Hant' || manualLang === 'en') next.searchParams.set('lang', manualLang);
    else next.searchParams.delete('lang');
    try { history.replaceState(null, '', next); } catch (e) {}
  }

  function setActive(value) { document.body.classList.toggle('search-active', value); }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function pkgFrom(value) {
    var id = value.match(/[?&]id=([A-Za-z0-9._]+)/);
    if (id) return id[1];
    var pkg = value.match(/([A-Za-z][A-Za-z0-9_]*(?:[.][A-Za-z0-9_]+)+)/);
    return pkg ? pkg[1] : '';
  }

  function load() {
    if (apps) return Promise.resolve(apps);
    if (loading) return loading;
    status.textContent = t('loadingIndex', { count: Number(TOTAL).toLocaleString(lang === 'en' ? 'en-US' : 'zh-CN') });
    loading = fetch('search-index.json', { cache: 'force-cache' })
      .then(function (response) {
        if (!response.ok) throw new Error(t('indexFailed'));
        return response.json();
      })
      .then(function (data) {
        apps = Array.isArray(data) ? data : (data.apps || []);
        return apps;
      })
      .catch(function (error) {
        status.textContent = error.message;
        apps = [];
        return apps;
      });
    return loading;
  }

  function rank(app, q) {
    var name = String(app.n || '').toLowerCase();
    var pkg = String(app.p || '').toLowerCase();
    var category = String(app.c || '').toLowerCase();
    if (name === q) return 0;
    if (name.indexOf(q) === 0) return 1;
    if (pkg === q) return 2;
    if (pkg.indexOf(q) === 0) return 3;
    if (name.indexOf(q) >= 0) return 4;
    if (pkg.indexOf(q) >= 0) return 5;
    if (category.indexOf(q) >= 0) return 6;
    return -1;
  }

  function item(app, direct) {
    var pkg = app.p;
    var href = workerHref(pkg);
    var icon = String(app.i || '');
    if (icon.indexOf('http://') === 0) icon = 'https://' + icon.slice(7);
    var letter = String(app.n || pkg || '?').slice(0, 1);
    var name = direct ? pkg : (app.n || pkg);
    var category = direct ? t('direct') : (app.c || '');
    return '<a class="item' + (WORKER ? '' : ' disabled') + '" href="' + esc(href) + '" data-worker-pkg="' + esc(pkg) + '"' + (WORKER ? '' : ' data-disabled="1"') + '>' +
      '<span class="icon">' + esc(letter) + (icon ? '<img loading="lazy" src="' + esc(icon) + '" alt="" onerror="this.remove()">' : '') + '</span>' +
      '<span class="body"><strong>' + esc(name) + '</strong><small>' + esc(pkg) + '</small></span>' +
      '<span class="cat">' + esc(category) + '</span></a>';
  }

  async function run() {
    var query = input.value.trim();
    if (!query) {
      results.className = 'results';
      results.innerHTML = '';
      status.textContent = '';
      setActive(false);
      return;
    }
    setActive(true);
    var list = await load();
    var lower = query.toLowerCase();
    var pkg = pkgFrom(query);
    var found = [];
    var seen = Object.create(null);
    if (pkg) {
      found.push({ direct: pkg });
      seen[pkg] = 1;
    }
    for (var i = 0; i < list.length; i += 1) {
      var app = list[i];
      if (!app || !app.p || seen[app.p]) continue;
      var score = rank(app, lower);
      if (score < 0) continue;
      seen[app.p] = 1;
      found.push({ app: app, score: score });
    }
    found.sort(function (a, b) {
      if (a.direct && !b.direct) return -1;
      if (!a.direct && b.direct) return 1;
      return a.score - b.score;
    });
    var limited = found.slice(0, 20);
    if (!limited.length) {
      results.className = 'results show';
      results.innerHTML = '<p class="empty">' + esc(t('empty')) + '</p>';
      status.textContent = t('retry');
      return;
    }
    results.className = 'results show';
    results.innerHTML = limited.map(function (entry) {
      return entry.direct ? item({ p: entry.direct }, true) : item(entry.app, false);
    }).join('');
    status.textContent = found.length > 20 ? t('foundLimit', { count: found.length }) : t('found', { count: found.length });
    if (!WORKER) status.textContent += t('noWorker');
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(run, 160);
  }

  input.addEventListener('focus', function () { setActive(true); });
  input.addEventListener('input', function () { setActive(true); schedule(); });
  input.addEventListener('blur', function () {
    setTimeout(function () {
      if (!input.value.trim() && !results.classList.contains('show')) setActive(false);
    }, 160);
  });
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    setActive(true);
    run();
  });
  results.addEventListener('click', function (event) {
    var link = event.target.closest('a.item');
    if (link && WORKER) rememberCurrentState();
    if (event.target.closest('.item.disabled')) {
      event.preventDefault();
      status.textContent = t('noWorkerHint');
    }
  });
  document.querySelectorAll('[data-lang]').forEach(function (button) {
    button.addEventListener('click', function () { applyLanguage(button.getAttribute('data-lang'), true); });
  });
  var themeToggle = document.getElementById('themeToggle');
  if (themeToggle) themeToggle.addEventListener('click', function () {
    var now = Date.now();
    var immediate = now - lastThemeToggleAt < 260;
    lastThemeToggleAt = now;
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true, immediate);
  });
  try {
    var media = matchMedia('(prefers-color-scheme: dark)');
    if (media.addEventListener) media.addEventListener('change', function (event) {
      try { if (localStorage.getItem(THEME_KEY)) return; } catch (e) {}
      applyTheme(event.matches ? 'dark' : 'light', false);
    });
  } catch (e) {}
  try {
    window.addEventListener('languagechange', function () {
      try { if (localStorage.getItem(LANG_KEY)) return; } catch (e) {}
      var next = navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language;
      next = String(next || '').toLowerCase();
      applyLanguage(!next.indexOf('zh') ? (/hant|tw|hk|mo/.test(next) ? 'zh-Hant' : 'zh-Hans') : 'en', false);
    });
  } catch (e) {}

  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false);
  applyLanguage(lang, false);
})();
</script>
</body>
</html>
