<!doctype html>
<html lang="zh-CN">
<head>
  <!-- UI fonts: Manrope + Noto Sans SC, SIL OFL 1.1, self-hosted under public/fonts. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#ffffff">
  <meta id="metaDescription" name="description" content="粘贴小米应用商店链接、包名或应用名称，生成 Obtainium 可直接读取的更新源。">
  <title>Mi2Obtainium</title>
  <link id="favicon" rel="icon" href="/favicon-light.svg?v=3" type="image/svg+xml">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('mi-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var favicon = document.getElementById('favicon');
        if (favicon) {
          favicon.href = theme === 'dark' ? '/favicon.svg?v=18' : '/favicon-light.svg?v=3';
        }
        var lang = localStorage.getItem('mi-lang');
        if (lang !== 'zh-Hans' && lang !== 'zh-Hant' && lang !== 'en') {
          lang = 'zh-Hans';
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'zh-CN'];
          for (var i = 0; i < list.length; i += 1) {
            var code = String(list[i] || '').toLowerCase();
            if (code.indexOf('zh') === 0) {
              lang = /hant|tw|hk|mo/.test(code) ? 'zh-Hant' : 'zh-Hans';
            } else {
              lang = 'en';
            }
            break;
          }
        }
        document.documentElement.lang = lang === 'zh-Hant' ? 'zh-Hant' : lang === 'en' ? 'en' : 'zh-CN';
      } catch (error) { /* storage or matchMedia unavailable */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=28">
</head>
<body>
  <div class="top-controls">
    <div class="lang-switch" role="group" aria-label="语言 / Language">
      <button type="button" data-lang="zh-Hans" aria-pressed="true">简中</button>
      <button type="button" data-lang="zh-Hant" aria-pressed="false">繁中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.5"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6 8.5 8.5 0 1 0 20.4 14.2Z"></path>
      </svg>
    </button>
  </div>

  <main class="page">
    <header class="masthead">
      <h1>
        <span class="title-xiaomi" id="storeTitle">小米应用商店</span>
        <span class="title-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 6 6 6-6 6"></path>
          </svg>
        </span>
        <span class="title-obtainium">Obtainium</span>
      </h1>
    </header>

    <section class="search-section">
      <form id="resolveForm" class="urlbar" role="search" autocomplete="off">
        <span class="urlbar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.2-3.2"></path>
          </svg>
        </span>
        <input id="input" name="q" type="text" inputmode="search"
               spellcheck="false" autocomplete="off" autocapitalize="off"
               placeholder="粘贴 app.mi.com 链接、包名，或输入应用名称"
               aria-label="小米应用商店链接、包名或应用名称">
        <button id="resolveBtn" type="submit" aria-label="解析">
          <span class="btn-label" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 6 6 6-6 6"></path>
            </svg>
          </span>
          <span class="spinner" hidden aria-hidden="true"></span>
        </button>
      </form>
      <div id="suggestions" class="suggestions" hidden role="listbox"></div>
      <p id="statusLine" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden aria-live="polite"></section>

    <footer class="site-foot">
      <button class="foot-link" type="button" data-info="about" aria-haspopup="dialog">关于</button>
      <span aria-hidden="true">·</span>
      <button class="foot-link" type="button" data-info="how" aria-haspopup="dialog">原理</button>
      <span aria-hidden="true">·</span>
      <a class="foot-link" href="https://github.com/akanesamaa/Mi2Obtainium" target="_blank" rel="noreferrer">GitHub ↗</a>
    </footer>
  </main>

  <dialog id="infoDialog" class="info-dialog">
    <div class="info-card">
      <div class="info-head">
        <h2 id="infoTitle"></h2>
        <button id="infoClose" class="info-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="infoBody" class="info-body"></div>
    </div>
  </dialog>

  <script src="/app.js?v=25" type="module"></script>
</body>
</html>
